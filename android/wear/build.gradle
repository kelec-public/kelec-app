// App Wear OS, pendant de l'app Apple Watch : une page par voiture, les Réglages, et les complications.
// Même applicationId que l'app du téléphone (obligatoire pour la Wearable Data Layer) et même signature.
// Java 17 et les dépôts sont réglés par le plugin Gradle de React Native pour tous les modules.
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"
// clés d'API du .env (BuildConfig et @string), comme l'app
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

android {
    namespace "com.kelec.wear"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.myrenaultplus'
        // minimum exigé par Google Play pour Wear OS depuis le 31 août 2026
        targetSdk 35
        minSdk 26
        // doit être différent de celui de l'app du téléphone (même fiche Play Store) : 2 000 000 + le sien
        versionCode 2000000 + rootProject.ext.kelecVersionCode
        versionName '2.7.1'
    }

    buildFeatures {
        compose true
        buildConfig true
        resValues true
    }

    signingConfigs {
        debug {
            storeFile file('../app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // même clé d'upload que l'app (voir app/build.gradle)
        if (System.getenv("ANDROID_KEYSTORE_PATH")) {
            release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // même réglage que l'app (voir app/build.gradle)
            signingConfig signingConfigs.findByName("release") ?: signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    implementation project(':shared')

    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.wear.compose:compose-material:1.4.0'
    implementation 'androidx.wear.compose:compose-foundation:1.4.0'
    implementation 'androidx.activity:activity-compose:1.9.3'

    // synchro avec le téléphone
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'

    // complications (pendant des widgets de l'Apple Watch)
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1'
    // protolayout-proto 1.0.0 (transitif des complications) embarque un protobuf vulnérable (CVE-2024-7254) :
    // on force la 1.2.1, compilée avec protobuf 4.28.2 (alerte Play Console).
    constraints {
        implementation('androidx.wear.protolayout:protolayout-proto:1.2.1') {
            because 'CVE-2024-7254'
        }
        implementation('androidx.wear.protolayout:protolayout-external-protobuf:1.2.1') {
            because 'CVE-2024-7254'
        }
    }

    // carte de la position de la voiture
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.maps.android:maps-compose:6.2.1'
}
